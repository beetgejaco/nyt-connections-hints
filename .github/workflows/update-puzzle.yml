name: Update daily puzzle

on:
  schedule:
    # 05:10 UTC covers midnight ET in both EST (UTC-5) and EDT (UTC-4)
    - cron: '10 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-puzzle.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/today.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update puzzle for $(date -u +%F)"
          git push
